[permissions]
allow = ["Bash=echo \"=== 代码量统计（排除依赖与构建产物）===\"; find electron src tests -type f \\( -name \"*.ts\" -o -name \"*.tsx\" -o -name \"*.css\" \\) | xargs wc -l | tail -1; echo; echo \"=== git 历史 ===\"; git log --oneline | wc -l; git log --format='%ai' | tail -1; git log --format='%ai' | head -1; echo; echo \"=== 提交类型分布 ===\"; git log --oneline | awk '{print $2}' | cut -d: -f1 | sort | uniq -c | sort -rn | head -15; echo; echo \"=== 分支 ===\"; git branch -a 2>/dev/null; echo; echo \"=== 是否跟踪了构建产物 ===\"; git ls-files | grep -cE '^(release|dist|dist-electron|node_modules|test-results)/' ; git ls-files | grep -E '\\.(log|exe|asar|dll|pak)$' | head -5", "Bash=cat .gitignore; echo \"=== 各目录代码量 ===\"; for d in electron src/shared src/pages src/lib src/components electron/handlers electron/repositories tests; do echo -n \"$d: \"; find $d -type f \\( -name \"*.ts\" -o -name \"*.tsx\" \\) 2>/dev/null | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}'; done", "Bash=grep -rn \"electron\" src/shared/ | head -3; echo \"shared->electron 引用数: $(grep -rn 'electron' src/shared/ | wc -l)\"; echo \"---\"; sed -n '10,30p' tests/analytics.test.ts; echo \"---\"; grep -n \"export type ChapterStatus\\|export type ProjectStatus\" src/shared/types.ts"]
