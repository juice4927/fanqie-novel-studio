name: release

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run test:electron

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # electron-builder 会为 exe 和 blockmap 各起一个 publisher；Release 还不存在时
      # 两边会各建一个，同一 tag 下出现两个 Release，资产被分散。先建好，publisher 就会复用它。
      - name: Create the release before building
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title ($tag -replace '^v', '') --generate-notes
          }
      - shell: pwsh
        run: >-
          npm run release:win --
          --publish always
          --config.publish.provider=github
          --config.publish.owner="$env:GH_OWNER"
          --config.publish.repo="$env:GH_REPO"
          --config.publish.releaseType=release
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-installer
          path: |
            release/*.exe
            release/latest.yml
